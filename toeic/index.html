<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Objectif TOEIC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: une feuille de réponses d'examen — papier pâle, encre "drop-out" rouge des formulaires, bulles cochées au crayon graphite. Colonne unique centrée de 760px. */
:root{
  --paper:#F3F5F0; --card:#FFFFFF; --ink:#1D2927; --muted:#5B6964; --line:#DCE2DC;
  --drop:#C9503C; --drop-soft:#F6DDD7; --graphite:#2B3135; --ok:#2C7A4D; --ok-soft:#DCEFE2; --bad:#B0281F; --bad-soft:#F7DCD9;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#131816; --card:#1B2220; --ink:#E5ECE8; --muted:#9BA8A3; --line:#2E3835;
  --drop:#E8775F; --drop-soft:#3A2420; --graphite:#E5ECE8; --ok:#63C08A; --ok-soft:#173326; --bad:#F2796E; --bad-soft:#3B1D1A; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#131816; --card:#1B2220; --ink:#E5ECE8; --muted:#9BA8A3; --line:#2E3835;
  --drop:#E8775F; --drop-soft:#3A2420; --graphite:#E5ECE8; --ok:#63C08A; --ok-soft:#173326; --bad:#F2796E; --bad-soft:#3B1D1A; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,6vw,2.9rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--drop)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--drop);outline-offset:2px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:10px;display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap}
@media (max-width:620px){header.top nav.tabs{flex:1 1 100%}}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.15rem;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand i{width:14px;height:14px;border-radius:50%;background:var(--graphite);box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--drop);display:inline-block}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{padding:7px 11px;border-radius:999px;text-decoration:none;color:var(--muted);font-size:.92rem;white-space:nowrap}
nav.tabs a.on{background:var(--ink);color:var(--paper)}
body.in-session header.top{display:none}

/* buttons */
a.btn{text-decoration:none;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;font-weight:700}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.accent{background:var(--drop);border-color:var(--drop);color:#fff}
.btn.small{padding:7px 13px;font-size:.9rem}
.btn.ghost{border-color:var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:.88rem}
.chip.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
section{margin-top:36px}
section>h2{margin-bottom:14px}

/* hero */
.hero{padding-top:28px;display:grid;gap:18px}
.hero p.lead{font-size:1.08rem;max-width:58ch;color:var(--muted)}
.scale{margin-top:6px}
.scale .bar{position:relative;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--drop-soft),var(--drop))}
.scale .tick{position:absolute;top:-4px;width:2px;height:20px;background:var(--ink);opacity:.5}
.scale .labels{position:relative;height:38px;font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.scale .labels span{position:absolute;transform:translateX(-50%);top:6px;text-align:center;line-height:1.2;white-space:nowrap}
.scale .me{position:absolute;top:-9px;width:24px;height:24px;border-radius:50%;background:var(--graphite);border:3px solid var(--card);transform:translateX(-50%)}
.score-line{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score-line b{font-family:var(--f-display);font-size:2.4rem;font-weight:800}

table.fmt{width:100%;border-collapse:collapse;font-size:.95rem}
table.fmt th,table.fmt td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.fmt th{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
table.fmt td.n{text-align:right;font-family:var(--f-mono)}
table.fmt tr.sec td{font-family:var(--f-display);font-weight:700;background:var(--paper);color:var(--drop)}
.tablebox{overflow-x:auto}

ol.plan{margin:0;padding:0;list-style:none;display:grid;gap:10px}
ol.plan li{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:start}
ol.plan li b{font-family:var(--f-mono);font-size:.8rem;color:var(--drop);padding-top:2px}

/* part grid */
.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.part{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.part:hover{border-color:var(--ink)}
.part .pn{font-family:var(--f-mono);font-size:.75rem;color:var(--drop);letter-spacing:.08em}
.part .pt{font-family:var(--f-display);font-weight:700;font-size:1.08rem}
.part .pm{font-size:.86rem;color:var(--muted)}
.part .acc{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}
.part .acc i{display:block;height:100%;background:var(--ok)}

.tip{border-left:3px solid var(--drop);padding:4px 0 4px 14px}

/* session */
.ses-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.ses-top .wrap{padding-block:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ses-top .grow{flex:1;min-width:0}
.ses-top .prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:6px}
.ses-top .prog i{display:block;height:100%;background:var(--drop);transition:width .3s}
.timer{font-family:var(--f-mono);font-weight:600;padding:5px 10px;border-radius:6px;background:var(--card);border:1px solid var(--line)}
.timer.warn{color:var(--bad);border-color:var(--bad)}
.unit{padding-top:22px;display:flex;flex-direction:column;gap:18px}
.dir{font-size:.92rem;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:var(--r);padding:10px 14px}

.audio{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.audio .st{flex:1;min-width:150px;font-size:.92rem;color:var(--muted);display:flex;align-items:center;gap:8px}
.wave{display:inline-flex;gap:3px;align-items:flex-end;height:16px}
.wave i{width:3px;background:var(--drop);height:4px;border-radius:2px}
.playing .wave i{animation:w 1s infinite ease-in-out}
.wave i:nth-child(2){animation-delay:.15s}.wave i:nth-child(3){animation-delay:.3s}.wave i:nth-child(4){animation-delay:.45s}
@keyframes w{0%,100%{height:4px}50%{height:16px}}
@media (prefers-reduced-motion:reduce){.playing .wave i{animation:none;height:10px}}
select.speed{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}

.photo{position:relative;width:100%;max-width:100%;aspect-ratio:4/3;border-radius:6px;overflow:hidden;border:8px solid var(--card);box-shadow:0 1px 0 var(--line),0 6px 18px rgba(0,0,0,.08)}
.photo span{position:absolute;transform:translate(-50%,-50%);line-height:1;user-select:none}
.photo .bar{position:absolute;height:5%;background:#8a6a4c;border-radius:3px;transform:translate(-50%,-50%)}
.photo small{position:absolute;right:8px;bottom:6px;font-family:var(--f-mono);font-size:.65rem;color:#3b3b3b;opacity:.6}

.doc{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:18px 18px 20px;white-space:pre-line;font-size:.97rem;box-shadow:3px 3px 0 var(--line)}
.doc .dt{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--drop);display:block;margin-bottom:8px;white-space:normal}
.blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--drop);text-align:center;font-family:var(--f-mono);font-size:.82rem;color:var(--drop);padding:0 4px;white-space:nowrap}
.blank.ins{display:block;border:2px dashed var(--drop);border-radius:6px;padding:4px;margin:6px 0;min-width:0}
.sent{font-size:1.12rem;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}

.q{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.qhead{display:flex;gap:10px;font-weight:700}
.qhead .qn{font-family:var(--f-mono);color:var(--drop);flex:none}
.opts{display:flex;flex-direction:column;gap:6px}
.opts.bubbles-only{flex-direction:row;gap:14px}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:left;background:transparent;border:1px solid transparent;border-radius:8px;padding:7px 8px}
.opt:hover:not(:disabled){background:var(--paper);border-color:var(--line)}
.opt:disabled{cursor:default}
.bub{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--drop);color:var(--drop);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:.85rem;transition:background .15s}
.ot{padding-top:3px;min-width:0}
.opt.sel .bub{background:var(--graphite);border-color:var(--graphite);color:var(--paper)}
.opt.good{background:var(--ok-soft)}
.opt.good .bub{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{background:var(--bad-soft)}
.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:#fff}
.fb{font-size:.95rem;border-radius:8px;padding:10px 12px}
.fb.good{background:var(--ok-soft)}
.fb.bad{background:var(--bad-soft)}
.fb b.v{display:block;margin-bottom:2px}
.fb.good b.v{color:var(--ok)}.fb.bad b.v{color:var(--bad)}
details.tr{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
details.tr summary{cursor:pointer;font-weight:700}
details.tr p{margin-top:6px}
details.tr .sp{font-family:var(--f-mono);font-size:.78rem;color:var(--drop);margin-right:6px}

.ses-nav{display:flex;gap:10px;justify-content:space-between;margin-top:22px;flex-wrap:wrap}
.palette{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.palette button{width:38px;height:34px;border-radius:6px;border:1px solid var(--line);background:var(--card);font-family:var(--f-mono);font-size:.8rem}
.palette button.done{background:var(--graphite);color:var(--paper);border-color:var(--graphite)}
.palette button.cur{outline:2px solid var(--drop);outline-offset:1px}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--drop-soft);border-radius:var(--r);padding:12px 14px;margin-top:12px}

.result-big{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.result-big .panel{display:flex;flex-direction:column;gap:2px}
.result-big b{font-family:var(--f-display);font-size:2.1rem;font-weight:800}
.lvl{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--ink);color:var(--paper);font-family:var(--f-mono);font-size:.8rem}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden;flex:1;min-width:80px}
.meter i{display:block;height:100%;background:var(--ok)}
.prow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(56px,1fr) 52px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.prow .mono{text-align:right}

/* vocab */
.flash{min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px;box-shadow:4px 4px 0 var(--line)}
.flash .w{font-family:var(--f-display);font-size:2rem;font-weight:800}
.flash .tr{font-size:1.25rem;color:var(--drop);font-weight:700}
.flash .ex{color:var(--muted);font-style:italic}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.vitem{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:.92rem;display:flex;flex-direction:column}
.vitem b{font-weight:700}
.vitem.k{border-color:var(--ok)}

/* grammar */
details.g{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
details.g+details.g{margin-top:10px}
details.g summary{cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:1.08rem;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.g summary::after{content:"+";color:var(--drop);font-family:var(--f-mono)}
details.g[open] summary::after{content:"–"}
.gbody{margin-top:12px;display:flex;flex-direction:column;gap:10px;font-size:.97rem}
.gbody table{border-collapse:collapse;width:100%;font-size:.92rem}
.gbody td,.gbody th{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:top}
.gbody .ex{font-style:italic;color:var(--muted)}
.gbody .warn{background:var(--drop-soft);border-radius:8px;padding:8px 12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:.92rem;z-index:20}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <div class="brand"><i></i>Objectif TOEIC</div>
  <nav class="tabs" id="nav">
    <a href="#accueil" data-v="accueil">Accueil</a>
    <a href="#entrainement" data-v="entrainement">Entraînement</a>
    <a href="#test" data-v="test">Test blanc</a>
    <a href="#vocabulaire" data-v="vocabulaire">Vocabulaire</a>
    <a href="#grammaire" data-v="grammaire">Grammaire</a>
    <a href="#progres" data-v="progres">Progrès</a>
  </nav>
</div></header>
<main id="app"></main>
<div class="toast" id="toast" hidden></div>

<script>
/* =========================================================
   BANQUE DE QUESTIONS (contenu original, format TOEIC L&R)
   a = index de la bonne réponse (les options sont mélangées à l'affichage)
   ========================================================= */
const P1=[
 {bg:"office",sc:[["bar",55,74,62],["👩‍💻",42,52,4.6],["🪴",84,56,2.8],["☕",68,66,1.7]],
  o:["A woman is watering a plant.","A woman is typing on a keyboard.","A woman is closing a window.","A woman is putting on her glasses."],a:1,
  ex:"On voit une femme qui travaille sur un ordinateur. La plante est visible, mais personne ne l'arrose : c'est le piège classique (objet présent + action fausse)."},
 {bg:"site",sc:[["🪜",45,55,6.2],["👷",45,36,3.6],["🧱",74,80,2.4],["🧱",83,80,2.4],["🚚",14,76,3.2]],
  o:["Some bricks are being loaded onto a truck.","A man is climbing down a staircase.","A worker is standing on a ladder.","The man is taking off his helmet."],a:2,
  ex:"L'ouvrier est debout sur une échelle (ladder). Le camion et les briques sont là, mais personne ne les charge. « Staircase » = escalier, pas échelle."},
 {bg:"outdoor",sc:[["🚲",25,74,3.4],["🚲",46,74,3.4],["🚲",67,74,3.4],["🌳",87,48,5],["🌳",8,50,4]],
  o:["Several bicycles are parked side by side.","Some cyclists are racing on a road.","A tree is being planted.","A bicycle is being repaired."],a:0,
  ex:"Il n'y a personne sur la photo : les réponses avec une action humaine (racing, being planted, being repaired) sont fausses. « Side by side » = côte à côte."},
 {bg:"restaurant",sc:[["bar",62,74,50],["🤵",28,50,4.4],["🍝",55,64,2.4],["🧑",80,52,3.6],["🍷",69,64,1.7]],
  o:["The customer is paying the bill.","The tables are being set up outside.","A man is pouring some water.","A waiter is bringing a dish to a table."],a:3,
  ex:"Le serveur (waiter) apporte un plat (dish). Le verre est visible mais personne ne verse (pour) de l'eau, et on ne voit pas de paiement."},
 {bg:"airport",sc:[["✈️",80,24,3.6],["🚶",40,56,4.4],["🧳",58,67,2.8],["🕐",14,22,2]],
  o:["A plane is being boarded.","A traveler is pulling a suitcase.","A man is checking a schedule board.","Suitcases are stacked on a cart."],a:1,
  ex:"Un voyageur tire une valise (pulling a suitcase). L'avion est en arrière-plan, mais personne n'embarque. Il n'y a qu'une seule valise, pas de chariot."},
 {bg:"office",sc:[["bar",50,74,72],["👨‍💼",20,52,3.6],["👩‍💼",50,48,3.6],["🧑‍💼",80,52,3.6],["📊",50,20,3.6]],
  o:["The people are shaking hands.","A woman is printing a document.","Some colleagues are gathered around a presentation.","The room is empty."],a:2,
  ex:"Trois collègues sont réunis devant un graphique : « gathered around a presentation ». Ils ne se serrent pas la main et la salle n'est pas vide."},
 {bg:"kitchen",sc:[["bar",55,74,62],["🧑‍🍳",34,48,4.4],["🔪",54,65,2],["🥕",65,66,2.2],["🥬",75,65,2.2],["🍲",86,40,2]],
  o:["A chef is washing dishes.","Some vegetables are being cut.","The oven door has been left open.","A man is tasting soup."],a:1,
  ex:"Forme passive très fréquente en Part 1 : « are being cut » = sont en train d'être coupés (le chef les coupe). La soupe est visible, mais il ne la goûte pas."},
 {bg:"library",sc:[["📚",20,22,3],["📚",40,22,3],["📚",60,22,3],["📚",80,22,3],["📚",20,46,3],["📚",40,46,3],["📚",60,46,3],["📚",80,46,3],["🧑‍🎓",48,78,3.2],["📖",62,82,1.8]],
  o:["A man is buying a book.","The shelves are empty.","A woman is writing on a board.","Books have been arranged on shelves."],a:3,
  ex:"« Have been arranged » décrit un état : les livres ont été rangés sur les étagères. Les étagères sont pleines, pas vides."},
 {bg:"street",sc:[["🚦",86,34,3.4],["🚗",20,72,3.2],["🚕",45,72,3.2],["🚌",70,70,3.6]],
  o:["Vehicles are stopped at an intersection.","A bus is being washed.","Pedestrians are crossing a bridge.","A car is parked in a garage."],a:0,
  ex:"Les véhicules (vehicles) attendent au feu. Il n'y a ni piétons (pedestrians), ni pont, ni garage."},
 {bg:"office",sc:[["bar",55,74,62],["🧑‍💼",40,50,4.4],["📞",58,63,2.2],["☕",72,65,1.7],["🗂️",86,63,2.4]],
  o:["A man is filing some folders.","A man is hanging up a picture.","A man is speaking on the telephone.","A man is drinking coffee."],a:2,
  ex:"L'homme est au téléphone. Le café et les dossiers sont présents mais il ne boit pas et ne classe rien : on décrit l'action principale, pas les objets autour."}

const P2=[

const GRAMMAR=[
 {tag:"wordform",t:"Nature des mots (nom, adjectif, adverbe, verbe)",h:`<p>C'est LE point le plus fréquent en Part 5 : les 4 réponses sont le même mot sous 4 formes. Regarde juste <b>avant et après le blanc</b>.</p>
<table><tr><th>Nature</th><th>Suffixes typiques</th><th>Où le trouver</th></tr>
<tr><td>Nom</td><td>-tion, -ment, -ness, -ity, -ance, -er/-or</td><td>après the/a/your/some, après un adjectif</td></tr>
<tr><td>Adjectif</td><td>-ive, -able, -ful, -ous, -al, -ent, -ic</td><td>devant un nom, après be/become/seem</td></tr>
<tr><td>Adverbe</td><td>-ly</td><td>devant un adjectif, autour d'un verbe, entre be et un participe</td></tr>
<tr><td>Verbe</td><td>-ize, -en, -ify</td><td>après un sujet, un modal, to</td></tr></table>
<p class="ex">The report was <b>extremely</b> (adv) <b>useful</b> (adj). — We need your <b>approval</b> (nom).</p>
<p class="warn">Pièges : <b>hard</b> = dur / durement, mais <b>hardly</b> = à peine. <b>friendly, costly, lively</b> sont des adjectifs malgré le -ly.</p>`},
 {tag:"prep",t:"Prépositions de temps et de lieu",h:`<table><tr><th>Préposition</th><th>Usage</th><th>Exemple</th></tr>
<tr><td>at</td><td>heure, lieu précis</td><td>at 9 a.m., at the desk</td></tr>
<tr><td>on</td><td>jour, date, étage, surface</td><td>on Monday, on June 3, on the 2nd floor</td></tr>
<tr><td>in</td><td>mois, année, ville, durée future</td><td>in May, in 2025, in Paris, in two days</td></tr>
<tr><td>by</td><td>au plus tard (date limite) / moyen</td><td>by Friday, by email, by train</td></tr>
<tr><td>until</td><td>jusqu'à (l'action continue)</td><td>open until 8 p.m.</td></tr>
<tr><td>since / for</td><td>depuis (point de départ) / pendant (durée)</td><td>since 2015 / for 3 years</td></tr>
<tr><td>during / while</td><td>pendant + nom / pendant que + phrase</td><td>during the meeting / while I was away</td></tr>
<tr><td>within</td><td>dans un délai de</td><td>within 30 days</td></tr>
<tr><td>between / among</td><td>entre deux / parmi plusieurs</td><td>between A and B / among the staff</td></tr></table>`},
 {tag:"tense",t:"Les temps verbaux essentiels",h:`<table><tr><th>Temps</th><th>Forme</th><th>Mots-indices</th></tr>
<tr><td>Présent simple</td><td>he works</td><td>every day, usually, often</td></tr>
<tr><td>Présent continu</td><td>he is working</td><td>now, currently, at the moment</td></tr>
<tr><td>Prétérit</td><td>he worked</td><td>yesterday, last week, ago, in 2020</td></tr>
<tr><td>Present perfect</td><td>he has worked</td><td>since, for, already, yet, recently, so far</td></tr>
<tr><td>Past perfect</td><td>he had worked</td><td>by the time + passé, before + passé</td></tr>
<tr><td>Futur</td><td>he will work</td><td>tomorrow, next month, soon</td></tr></table>
<p class="warn">Piège n°1 des francophones : « Je travaille ici depuis 2 ans » = <b>I have worked here for two years</b> (jamais « I work here since »).</p>`},
 {tag:"passive",t:"La voix passive",h:`<p>Forme : <b>be (conjugué) + participe passé</b>. On l'utilise quand le sujet <i>subit</i> l'action.</p>
<p class="ex">The office <b>is cleaned</b> every day. — The report <b>will be sent</b> tomorrow. — The packages <b>have been delivered</b>.</p>
<p>Astuce Part 5 : si le blanc est suivi de « by + personne » ou s'il n'y a pas de complément d'objet derrière le verbe, pense passif.</p>
<p>Part 1 : <b>is being + participe</b> = action en train de se faire (quelqu'un doit être visible). <b>has been + participe</b> = état, résultat.</p>`},
 {tag:"cond",t:"Conditions : if, unless",h:`<table><tr><th>Type</th><th>Structure</th><th>Exemple</th></tr>
<tr><td>Réel (type 1)</td><td>If + présent, will + verbe</td><td>If it rains, we will stay inside.</td></tr>
<tr><td>Hypothèse (type 2)</td><td>If + prétérit, would + verbe</td><td>If I had time, I would help.</td></tr>
<tr><td>Passé (type 3)</td><td>If + had + p.p., would have + p.p.</td><td>If he had called, I would have answered.</td></tr></table>
<p class="warn">Jamais de <b>will</b> juste après if / unless / when / as soon as. <b>Unless</b> = if… not (à moins que).</p>`},
 {tag:"conj",t:"Connecteurs logiques",h:`<p>Règle d'or : regarde ce qui suit le blanc. <b>Phrase complète (sujet + verbe)</b> → conjonction. <b>Nom / groupe nominal</b> → préposition.</p>
<table><tr><th>Sens</th><th>+ phrase</th><th>+ nom</th></tr>
<tr><td>Cause</td><td>because, since, as</td><td>because of, due to, owing to</td></tr>
<tr><td>Opposition</td><td>although, even though, whereas</td><td>despite, in spite of</td></tr>
<tr><td>But</td><td>so that</td><td>in order to + verbe</td></tr>
<tr><td>Condition</td><td>if, unless, as long as, provided that</td><td>—</td></tr>
<tr><td>Précaution</td><td>in case</td><td>in case of</td></tr></table>
<p>Adverbes de liaison (avec virgule) : <b>However</b> (cependant), <b>Therefore</b> (donc), <b>In addition / Moreover</b> (de plus), <b>In the meantime</b> (en attendant), <b>Otherwise</b> (sinon).</p>`},
 {tag:"rel",t:"Pronoms relatifs",h:`<table><tr><th>Pronom</th><th>Pour</th><th>Exemple</th></tr>
<tr><td>who</td><td>personne (sujet)</td><td>The man who called…</td></tr>
<tr><td>whom</td><td>personne (complément, après préposition)</td><td>The client to whom I wrote…</td></tr>
<tr><td>which</td><td>chose</td><td>The files which you need…</td></tr>
<tr><td>that</td><td>personne ou chose (pas après une virgule)</td><td>The car that I rented…</td></tr>
<tr><td>whose</td><td>possession (dont)</td><td>A firm whose profits rose…</td></tr></table>`},
 {tag:"comp",t:"Comparatifs et superlatifs",h:`<table><tr><th></th><th>Adjectif court</th><th>Adjectif long</th></tr>
<tr><td>Comparatif</td><td>cheaper than</td><td>more expensive than</td></tr>
<tr><td>Superlatif</td><td>the cheapest</td><td>the most expensive</td></tr>
<tr><td>Égalité</td><td colspan="2">as cheap as / not as expensive as</td></tr></table>
<p>Irréguliers : good → better → the best ; bad → worse → the worst ; far → further.</p>
<p class="ex">The more you read, the faster you become. (Plus… plus…)</p>`},
 {tag:"verbpat",t:"Infinitif, -ing ou base verbale ?",h:`<table><tr><th>Structure</th><th>Verbes</th></tr>
<tr><td>+ base verbale</td><td>modaux : can, must, should, will, may ; let, make, help ; please (impératif)</td></tr>
<tr><td>+ to + verbe</td><td>want, plan, decide, agree, hope, offer, need, would like, would prefer, ask sb, expect</td></tr>
<tr><td>+ V-ing</td><td>enjoy, avoid, finish, consider, suggest, mind, keep, après une préposition (before, after, without, for)</td></tr></table>
<p class="warn">« to » préposition → V-ing : <b>look forward to meeting</b>, <b>be used to working</b>, <b>be committed to providing</b>.</p>`},
 {tag:"agree",t:"Accords et quantifieurs",h:`<p><b>each / every / either / neither + singulier</b> : Each employee <b>has</b> a badge.</p>
<table><tr><th>Dénombrable (pluriel)</th><th>Indénombrable</th></tr>
<tr><td>many, few, a few, several, a number of</td><td>much, little, a little, an amount of</td></tr>
<tr><td colspan="2">Les deux : a lot of, some, any, plenty of, most</td></tr></table>
<p>Paires fixes : <b>both … and</b>, <b>either … or</b>, <b>neither … nor</b>, <b>not only … but also</b>.</p>
<p class="warn">Indénombrables en anglais : information, advice, equipment, furniture, luggage, feedback (jamais de -s).</p>`}
];

 1:{n:"Part 1",t:"Photographies",sec:"L",real:6,d:"Une photo, 4 phrases entendues. Choisis celle qui décrit le mieux l'image. Les phrases ne sont pas écrites.",

 3:{n:"Part 3",t:"Conversations",sec:"L",real:39,d:"Une conversation entre 2 ou 3 personnes, puis 3 questions écrites à 4 choix.",

 4:{n:"Part 4",t:"Exposés",sec:"L",real:30,d:"Un monologue (annonce, message, publicité, radio), puis 3 questions écrites.",

 5:{n:"Part 5",t:"Phrases à compléter",sec:"R",real:30,d:"Une phrase avec un blanc et 4 propositions. Grammaire et vocabulaire.",

 6:{n:"Part 6",t:"Textes à compléter",sec:"R",real:16,d:"Un texte court avec 4 blancs, dont 1 phrase entière à insérer.",

 7:{n:"Part 7",t:"Compréhension écrite",sec:"R",real:54,d:"E-mails, articles, annonces, messages : un, deux ou trois documents et 2 à 5 questions.",

const KEY="toeic.v1";
function load(){const d={ans:{},hist:[],vocab:{},rate:0.9,showText:false};try{const x=JSON.parse(localStorage.getItem(KEY));return x?Object.assign(d,x):d}catch(e){return d}}

const LET=["A","B","C","D"];
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2200)}

/* ================== UNITÉS ================== */
const UNITS=[];
P1.forEach((x,i)=>UNITS.push({part:1,id:"p1-"+(i+1),bg:x.bg,sc:x.sc,qs:[{uid:"p1-"+(i+1),o:x.o,a:x.a,ex:x.ex}]}));
P2.forEach((x,i)=>UNITS.push({part:2,id:"p2-"+(i+1),g:i%2?"M":"W",qs:[{uid:"p2-"+(i+1),q:x.q,o:x.o,a:x.a,ex:x.ex}]}));
P3.forEach((x,i)=>UNITS.push({part:3,id:"p3-"+(i+1),lines:x.lines,qs:x.qs.map((q,j)=>({uid:`p3-${i+1}-${j+1}`,...q}))}));
P4.forEach((x,i)=>UNITS.push({part:4,id:"p4-"+(i+1),kind:x.kind,g:x.g,text:x.text,qs:x.qs.map((q,j)=>({uid:`p4-${i+1}-${j+1}`,...q}))}));
P5.forEach((x,i)=>UNITS.push({part:5,id:"p5-"+(i+1),tag:x.t,qs:[{uid:"p5-"+(i+1),q:x.s,o:x.o,a:x.a,ex:x.ex}]}));
P6.forEach((x,i)=>UNITS.push({part:6,id:"p6-"+(i+1),title:x.title,text:x.text,qs:x.qs.map((q,j)=>({uid:`p6-${i+1}-${j+1}`,...q}))}));
P7.forEach((x,i)=>UNITS.push({part:7,id:"p7-"+(i+1),docs:x.docs,qs:x.qs.map((q,j)=>({uid:`p7-${i+1}-${j+1}`,...q}))}));
const byPart=p=>UNITS.filter(u=>u.part===p);
const qCount=us=>us.reduce((n,u)=>n+u.qs.length,0);

/* ================== VOIX (synthèse vocale) ================== */
const TTS={ok:"speechSynthesis" in window,M:null,W:null,N:null,tok:0,keep:[],
 init(){ if(!this.ok)return; const pick=()=>{
   const vs=speechSynthesis.getVoices().filter(v=>/^en([-_]|$)/i.test(v.lang));
   const F=/female|zira|samantha|karen|moira|tessa|victoria|susan|hazel|aria|jenny|libby|sonia|natasha|emma|ava|allison|serena|kate|fiona|catherine|joanna|salli|kendra|kimberly|ivy|nicky|michelle|clara|google us english/i;
   const Mr=/male|david|mark|guy|daniel|alex|fred|tom\b|arthur|aaron|rishi|oliver|george|james|ryan|eric|christopher|brian|andrew|roger|steffan|liam|william|thomas|gordon|lee\b/i;
   const isF=v=>F.test(v.name), isM=v=>!isF(v)&&Mr.test(v.name);
   this.W=vs.find(v=>isF(v)&&/US/i.test(v.lang))||vs.find(isF)||vs[0]||null;
   this.M=vs.find(v=>isM(v)&&/GB/i.test(v.lang))||vs.find(isM)||vs.find(v=>v!==this.W)||this.W;
   this.N=vs.find(v=>isM(v)&&v!==this.M)||vs.find(v=>v!==this.W&&v!==this.M)||this.M;
  }; pick(); speechSynthesis.onvoiceschanged=pick; },
 stop(){this.tok++; if(this.ok){try{speechSynthesis.cancel()}catch(e){}}},
 play(lines,onend){
   this.stop(); const tok=this.tok;
   if(!this.ok){onend&&onend(false);return}
   let i=0; const same=this.M===this.W;
   const next=()=>{ if(tok!==this.tok)return; if(i>=lines.length){onend&&onend(true);return}
     const [s,txt]=lines[i++]; const u=new SpeechSynthesisUtterance(txt);
     const v=s==="M"?this.M:s==="W"?this.W:this.N; if(v){u.voice=v;u.lang=v.lang}else u.lang="en-US";
     u.rate=S.rate; u.pitch=same?(s==="M"?.75:s==="W"?1.25:1):1;
     let done=false; const fin=()=>{if(done)return;done=true;clearInterval(w);setTimeout(next,380)};
     u.onend=fin; u.onerror=fin; this.keep=[u];
     speechSynthesis.speak(u);
     let started=Date.now(); const w=setInterval(()=>{ if(tok!==this.tok){clearInterval(w);return}
       if(Date.now()-started>1200&&!speechSynthesis.speaking&&!speechSynthesis.pending)fin();
       if(Date.now()-started>30000)fin(); },300);
   }; next();
 },
 say(txt){this.play([["W",txt]])}
};
TTS.init();
const sentences=t=>t.match(/[^.!?]+[.!?]+[”"]?|\S[^.!?]*$/g).map(x=>x.trim());

/* ================== SESSION (entraînement / examen / correction) ================== */
let SES=null, TIMER=null, CD=null;
function prep(units){ let n=1; return units.map(u=>({...u,qs:u.qs.map(q=>({...q,perm:shuffle([...q.o.keys()]),n:n++}))})) }
function startSession(units,mode,opt={}){
  stopAll(); if(!units.length){toast("Aucune question disponible ici.");return}
  SES={mode,units:prep(units),i:0,picks:{},title:opt.title||"Entraînement",kind:opt.kind||"train",readSecs:opt.readSecs||0,stage:mode==="exam"?"introL":"run",confirmQuit:false,confirmEnd:false};
  document.body.classList.add("in-session"); location.hash="session"; renderSession();
}
function stopAll(){TTS.stop();clearInterval(TIMER);clearInterval(CD);TIMER=CD=null}
function quitSession(){stopAll();SES=null;document.body.classList.remove("in-session");location.hash="accueil"}
const isL=u=>u.part<=4;

function audioScript(u){
  const q0=u.qs[0];
  if(u.part===1)return [["N",`Number ${q0.n}. Look at the picture.`],...q0.perm.map((k,i)=>["N",`${LET[i]}. ${q0.o[k]}`])];
  if(u.part===2){const s2=u.g==="W"?"M":"W";return [["N",`Number ${q0.n}.`],[u.g,q0.q],...q0.perm.map((k,i)=>[s2,`${LET[i]}. ${q0.o[k]}`])]}
  const last=u.qs[u.qs.length-1].n;
  if(u.part===3)return [["N",`Questions ${q0.n} through ${last} refer to the following conversation.`],...u.lines.flatMap(([s,t])=>sentences(t).map(x=>[s,x]))];
  return [["N",`Questions ${q0.n} through ${last} refer to the following ${u.kind}.`],...sentences(u.text).map(x=>[u.g,x])];
}

function renderSession(){
  if(!SES)return; const app=$("#app");
  if(SES.stage==="introL"){app.innerHTML=sesTop()+`<div class="wrap"><div class="unit"><span class="eyebrow">Section 1 · Listening</span><h1>Compréhension orale</h1>
   <p class="muted">${qCount(SES.units.filter(isL))} questions, Parts 1 à 4. Comme au vrai TOEIC, chaque audio passe <b>une seule fois</b> et la question suivante arrive automatiquement après quelques secondes. Monte le son et mets un casque si possible.</p>
   ${TTS.ok?"":`<p class="dir">Ton navigateur ne gère pas la synthèse vocale : la transcription sera affichée à la place de l'audio.</p>`}
   <div class="row"><button class="btn accent" id="go">Commencer le Listening</button></div></div></div>`;
   $("#go").onclick=()=>{SES.stage="run";renderSession()}; bindTop(); return}
  if(SES.stage==="introR"){app.innerHTML=sesTop()+`<div class="wrap"><div class="unit"><span class="eyebrow">Section 2 · Reading</span><h1>Compréhension écrite</h1>
   <p class="muted">${qCount(SES.units.filter(u=>!isL(u)))} questions, Parts 5 à 7. Tu as <b>${Math.round(SES.readSecs/60)} minutes</b> (même rythme que le vrai test : 75 min pour 100 questions). Tu peux naviguer librement entre les questions.</p>
   <div class="row"><button class="btn accent" id="go">Lancer le chrono</button></div></div></div>`;
   $("#go").onclick=()=>{SES.stage="run";SES.readEnd=Date.now()+SES.readSecs*1000;startReadTimer();renderSession()}; bindTop(); return}
  if(SES.stage==="done"){renderResults();return}

  const u=SES.units[SES.i]; const P=PARTS[u.part];
  const exam=SES.mode==="exam", review=SES.mode==="review";
  let h=sesTop()+`<div class="wrap"><div class="unit"><div><span class="eyebrow">${P.n} · ${P.t}</span></div>`;
  if(SES.i===0||SES.units[SES.i-1].part!==u.part)h+=`<p class="dir">${P.d}</p>`;
  if(isL(u))h+=audioBox(u);
  if(u.part===1)h+=photo(u);
  if(u.part===5)h+=`<div class="sent">${esc(u.qs[0].q).replace("-------",`<span class="blank">${u.qs[0].n}</span>`)}</div>`;
  if(u.part===6)h+=p6doc(u);
  if(u.part===7)h+=u.docs.map(d=>`<div class="doc"><span class="dt">${esc(d.t)}</span>${esc(d.b)}</div>`).join("");
  if(!TTS.ok&&isL(u)&&!review)h+=transcript(u,true);
  h+=u.qs.map(q=>qBlock(u,q)).join("");
  if(isL(u)&&(review||(SES.mode==="train"&&u.qs.every(q=>q.uid in SES.picks))))h+=transcript(u,false);
  h+=navBar(u)+`</div></div>`;
  app.innerHTML=h; bindTop(); bindUnit(u);
  window.scrollTo(0,0);
  if(isL(u)&&!review&&SES.autoplayFor!==SES.i){SES.autoplayFor=SES.i;playUnit(u)}
}
function sesTop(){
  const tot=SES.units.length, pct=Math.round(((SES.i+(SES.stage==="run"?1:0))/tot)*100);
  const label=SES.mode==="exam"?SES.title:SES.mode==="review"?"Correction":SES.title;
  const showTimer=SES.mode==="exam"&&SES.readEnd&&SES.stage==="run"&&!isL(SES.units[SES.i]);
  return `<div class="ses-top"><div class="wrap">
   ${SES.confirmQuit?`<span>Quitter ? ${SES.mode==="exam"?"Le test sera perdu.":""}</span><button class="btn small accent" id="qyes">Oui, quitter</button><button class="btn small ghost" id="qno">Continuer</button>`:`<button class="btn small ghost" id="quit">✕ Quitter</button>`}
   <div class="grow"><div class="mono" style="font-size:.85rem">${esc(label)} · ${SES.stage==="run"?`écran ${SES.i+1} / ${tot}`:""}</div><div class="prog"><i style="width:${pct}%"></i></div></div>
   ${showTimer?`<span class="timer" id="timer">--:--</span>`:""}
  </div></div>`;
}
function bindTop(){
  const q=$("#quit"); if(q)q.onclick=()=>{ if(SES.mode==="train"&&!Object.keys(SES.picks).length){quitSession();return} SES.confirmQuit=true; rerenderTop()};
  const y=$("#qyes"); if(y)y.onclick=()=>{ if(SES.mode==="train"&&Object.keys(SES.picks).length){finish();return} quitSession()};
  const n=$("#qno"); if(n)n.onclick=()=>{SES.confirmQuit=false;rerenderTop()};
  if(SES&&SES.readEnd)tickTimer();
}
function rerenderTop(){const t=document.querySelector(".ses-top");if(!t)return;const d=document.createElement("div");d.innerHTML=sesTop();t.replaceWith(d.firstElementChild);bindTop()}

function audioBox(u){
  const exam=SES.mode==="exam";
  return `<div class="audio" id="audio"><div class="st"><span class="wave"><i></i><i></i><i></i><i></i></span><span id="ast">${TTS.ok?"Prêt":"Audio indisponible"}</span></div>
   ${exam?"":`<button class="btn small" id="aplay">▶ Écouter</button><button class="btn small ghost" id="astop">■ Stop</button>
   <label class="row" style="gap:6px;font-size:.88rem" for="speed">Vitesse <select class="speed" id="speed">${[[.7,"Lente"],[.85,"Calme"],[.9,"Normale"],[1,"Rapide"]].map(([v,l])=>`<option value="${v}" ${S.rate==v?"selected":""}>${l}</option>`).join("")}</select></label>`}
  </div>${!exam&&(u.part<=2)?`<label style="display:flex;gap:10px;align-items:flex-start;font-size:.92rem" for="showtxt"><input type="checkbox" id="showtxt" style="margin-top:4px;flex:none" ${S.showText?"checked":""}><span>Afficher le texte des réponses (aide débutant ; au vrai test il n'est pas écrit)</span></label>`:""}`;
}
function setAst(t,playing){const a=$("#ast");if(a)a.textContent=t;const b=$("#audio");if(b)b.classList.toggle("playing",!!playing)}
function playUnit(u){
  const exam=SES.mode==="exam"; const idx=SES.i;
  setAst("Écoute en cours…",true);
  TTS.play(audioScript(u),(ok)=>{
    if(!SES||SES.i!==idx)return;
    if(!exam){setAst(ok?"Terminé — tu peux réécouter":"Audio indisponible",false);return}
    let left=u.part<=2?7:u.qs.length*9;
    setAst(`Réponds… ${left}s`,false);
    clearInterval(CD); CD=setInterval(()=>{ if(!SES||SES.i!==idx){clearInterval(CD);return} left--; setAst(`Réponds… ${left}s`,false); if(left<=0){clearInterval(CD);go(1)} },1000);
  });
}
function photo(u){
  const BG={office:["#dde6ee","#b9c6d2"],site:["#d9e6f2","#c9b38f"],outdoor:["#cfe6f6","#b9d6a5"],restaurant:["#f1e1d5","#c9a98d"],airport:["#e3edf6","#c2ccd6"],kitchen:["#eef0ea","#cdbfae"],library:["#efe3cf","#b99b77"],street:["#d8e3ec","#9aa1a8"]}[u.bg];
  return `<div class="photo" role="img" aria-label="Illustration de la scène" style="background:linear-gradient(to bottom,${BG[0]} 0 64%,${BG[1]} 64% 100%)">${u.sc.map(([e,x,y,s])=>e==="bar"?`<i class="bar" style="left:${x}%;top:${y}%;width:${s}%"></i>`:`<span style="left:${x}%;top:${y}%;font-size:${s*.8}rem">${e}</span>`).join("")}<small>Illustration · au test : photo réelle</small></div>`;
}
function p6doc(u){
  let t=esc(u.text);
  u.qs.forEach((q,j)=>{t=t.replace(`{${j}}`,q.ins?`<span class="blank ins">[ ${q.n} ] — phrase à insérer</span>`:`<span class="blank">${q.n}</span>`)});
  return `<div class="doc"><span class="dt">${esc(u.title)}</span>${t}</div>`;
}
function qBlock(u,q){
  const pick=SES.picks[q.uid]; const answered=pick!==undefined;
  const reveal=SES.mode==="review"||(SES.mode==="train"&&answered);
  const hideText=(u.part<=2)&&!reveal&&!(SES.mode==="train"&&S.showText);
  let head="";
  if(u.part===3||u.part===4||u.part===7)head=`<div class="qhead"><span class="qn">${q.n}.</span><span>${esc(q.q)}</span></div>`;
  else if(u.part===6)head=`<div class="qhead"><span class="qn">${q.n}.</span><span>${q.ins?"Quelle phrase convient le mieux à l'espace ["+q.n+"] ?":"Complète l'espace "+q.n}</span></div>`;
  else head=`<div class="qhead"><span class="qn">${q.n}.</span><span class="muted" style="font-weight:400">${u.part===1?"Quelle phrase décrit le mieux l'image ?":u.part===2?"Choisis la meilleure réponse.":"Choisis le mot qui complète la phrase."}</span></div>`;
  const opts=q.perm.map((k,i)=>{
    let c="opt"; if(answered&&pick===k)c+=" sel";
    if(reveal){ if(k===q.a)c+=" good"; else if(pick===k)c+=" wrong" }
    return `<button class="${c}" data-u="${q.uid}" data-k="${k}" ${reveal?"disabled":""} aria-label="Réponse ${LET[i]}"><span class="bub">${LET[i]}</span>${hideText?"":`<span class="ot">${esc(q.o[k])}</span>`}</button>`}).join("");
  let fb="";
  if(reveal){ const ok=pick===q.a; const L=LET[q.perm.indexOf(q.a)];
    fb=`<div class="fb ${ok?"good":"bad"}"><b class="v">${pick===undefined?"Pas de réponse — c'était ("+L+")":ok?"✓ Bonne réponse":"✗ La bonne réponse était ("+L+")"}</b>${esc(q.ex)}</div>` }
  return `<div class="q" id="q-${q.uid}">${head}<div class="opts ${hideText?"bubbles-only":""}">${opts}</div>${fb}</div>`;
}
function transcript(u,open){
  const tag=(s)=>`<span class="sp">${s==="M"?"Homme":s==="W"?"Femme":""}</span>`;
  let b="";
  if(u.part===1){const q=u.qs[0];b=q.perm.map((k,i)=>`<p>(${LET[i]}) ${esc(q.o[k])}</p>`).join("")}
  else if(u.part===2){const q=u.qs[0];b=`<p>${tag(u.g)}${esc(q.q)}</p>`+q.perm.map((k,i)=>`<p>(${LET[i]}) ${esc(q.o[k])}</p>`).join("")}
  else if(u.part===3)b=u.lines.map(([s,t])=>`<p>${tag(s)}${esc(t)}</p>`).join("");
  else b=`<p>${esc(u.text)}</p>`;
  return `<details class="tr" ${open?"open":""}><summary>Transcription de l'audio</summary>${b}</details>`;
}

function bindUnit(u){

function go(d){
  if(!SES)return; clearInterval(CD);

  if(d>0&&SES.i>=SES.units.length-1){ if(SES.mode==="review"){quitToResults();return} finish(); return }
  if(d>0&&SES.mode==="exam"&&isL(u)&&!isL(SES.units[SES.i+1])){TTS.stop();SES.i++;SES.stage="introR";renderSession();return}

function tickTimer(){ if(!SES||!SES.readEnd)return; const left=Math.max(0,Math.round((SES.readEnd-Date.now())/1000));

function record(q,ok){const r=S.ans[q.uid]||{c:0,n:0};r.n++;if(ok)r.c++;r.last=ok;S.ans[q.uid]=r;save()}
function conv(p,t){for(let i=1;i<t.length;i++)if(p<=t[i][0]){const[a,b]=t[i-1],[c,d]=t[i];return Math.max(5,Math.round((b+(d-b)*(p-a)/(c-a))/5)*5)}return 495}
const LT=[[0,5],[10,5],[20,60],[30,115],[40,175],[50,240],[60,300],[70,360],[80,415],[90,465],[100,495]];
const RT=[[0,5],[10,5],[20,45],[30,95],[40,150],[50,205],[60,265],[70,325],[80,390],[90,450],[100,495]];
function cefr(t){return t>=945?"C1":t>=785?"B2":t>=550?"B1":t>=225?"A2":t>=120?"A1":"< A1"}

function finish(){
  stopAll(); const parts={};
  SES.units.forEach(u=>u.qs.forEach(q=>{const p=parts[u.part]||(parts[u.part]=[0,0]);p[1]++;if(SES.picks[q.uid]===q.a)p[0]++;
    if(SES.mode==="exam")record(q,SES.picks[q.uid]===q.a)}));
  const sum=(ps)=>ps.reduce((a,p)=>[a[0]+(parts[p]?parts[p][0]:0),a[1]+(parts[p]?parts[p][1]:0)],[0,0]);
  const L=sum([1,2,3,4]),R=sum([5,6,7]);
  const res={parts,L,R,date:new Date().toISOString(),kind:SES.kind};
  if(SES.mode==="exam"){res.Ls=conv(L[0]/L[1]*100,LT);res.Rs=conv(R[0]/R[1]*100,RT);res.T=res.Ls+res.Rs;S.hist.push({d:res.date,k:SES.title,Ls:res.Ls,Rs:res.Rs,T:res.T,parts});save()}
  SES.result=res; SES.stage="done"; SES.confirmQuit=false; renderSession();
}

  h+=`<div class="panel"><h3 style="margin-bottom:6px">Détail par partie</h3>${Object.keys(r.parts).sort().map(p=>{const [c,t]=r.parts[p];const pc=Math.round(c/t*100);return `<div class="prow"><span>${PARTS[p].n} · ${PARTS[p].t}</span><span class="meter"><i style="width:${pc}%"></i></span><span class="mono">${c}/${t}</span></div>`}).join("")}</div>`;

function bindVocab(){
  document.querySelectorAll("[data-th]").forEach(b=>b.onclick=()=>{V.theme=b.dataset.th;V.i=0;V.flip=false;V.quiz=null;V.deck=deckFor(V.theme);route()});
  document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{V.mode=b.dataset.m;V.quiz=null;V.flip=false;route()});
  const f=$("#flip");if(f)f.onclick=()=>{V.flip=true;route()};
  const s=$("#say");if(s)s.onclick=()=>{const w=V.deck[V.i%V.deck.length];TTS.play([["W",w[0].replace(/^to /,"")],["W",w[2]]])};
  const k=$("#know");if(k)k.onclick=()=>{const w=V.deck[V.i%V.deck.length];S.vocab[w[0]]=1;save();V.i++;V.flip=false;route()};
  const a=$("#again");if(a)a.onclick=()=>{const w=V.deck[V.i%V.deck.length];delete S.vocab[w[0]];save();V.i++;V.flip=false;route()};
  document.querySelectorAll("[data-qo]").forEach(b=>b.onclick=()=>{const Q=V.quiz;Q.pick=+b.dataset.qo;const q=Q.qs[Q.i];if(q.opts[Q.pick]===q.w){Q.score++;S.vocab[q.w[0]]=1;save()}route()});
  const qn=$("#qnext");if(qn)qn.onclick=()=>{V.quiz.i++;V.quiz.pick=null;route()};
  const qr=$("#qre");if(qr)qr.onclick=()=>{V.quiz=null;route()};
}
function pageGrammar(){
  return `<div class="wrap"><div class="unit"><span class="eyebrow">Grammaire</span><h1>Les 10 fiches essentielles</h1><p class="muted">Tout ce qui revient en Part 5 et Part 6, expliqué en français. Chaque fiche se termine par des exercices ciblés.</p>
  <div>${GRAMMAR.map(g=>{const n=P5.filter(x=>x.t===g.tag).length;return `<details class="g"><summary>${esc(g.t)}</summary><div class="gbody">${g.h}<div class="row"><button class="btn small accent" data-gtag="${g.tag}">S'entraîner (${n} questions)</button></div></div></details>`}).join("")}</div></div></div>`;
}
function pageProgress(){
  const wrong=UNITS.filter(u=>u.qs.some(q=>S.ans[q.uid]&&S.ans[q.uid].last===false));
  const wq=UNITS.flatMap(u=>u.qs).filter(q=>S.ans[q.uid]&&S.ans[q.uid].last===false).length;
  const vk=Object.keys(S.vocab).length, vt=Object.values(VOCAB).flat().length;
  return `<div class="wrap"><div class="unit"><span class="eyebrow">Progrès</span><h1>Où tu en es</h1>
   <div class="panel"><h3 style="margin-bottom:6px">Réussite par partie</h3><p class="muted" style="font-size:.88rem">Basé sur ta dernière réponse à chaque question.</p>
    ${[1,2,3,4,5,6,7].map(p=>{const a=partAcc(p);return `<div class="prow"><span>${PARTS[p].n} · ${PARTS[p].t}</span><span class="meter"><i style="width:${a?a[0]/a[1]*100:0}%"></i></span><span class="mono">${a?Math.round(a[0]/a[1]*100)+" %":"—"}</span></div>`}).join("")}
    <div class="prow"><span>Vocabulaire</span><span class="meter"><i style="width:${vk/vt*100}%"></i></span><span class="mono">${vk}/${vt}</span></div></div>
   <div class="panel stack"><h3>Mes erreurs</h3><p class="muted">${wq?`${wq} question(s) ratée(s) à refaire. Une question réussie sort de la liste.`:"Aucune erreur en attente. Bravo, ou alors il est temps de t'entraîner !"}</p>${wq?`<div class="row"><button class="btn accent" id="redo">Refaire mes erreurs</button></div>`:""}</div>
   <div class="panel"><h3 style="margin-bottom:6px">Historique des tests blancs</h3>${S.hist.length?S.hist.slice().reverse().map(h=>`<div class="prow"><span>${new Date(h.d).toLocaleDateString("fr-FR")} · ${esc(h.k)} <span class="muted mono" style="font-size:.8rem">L ${h.Ls} · R ${h.Rs}</span></span><span class="meter"><i style="width:${h.T/990*100}%"></i></span><span class="mono">${h.T}</span></div>`).join(""):`<p class="muted">Pas encore de test blanc.</p>`}</div>
   <div class="row" id="resetzone"><button class="btn small ghost" id="reset">Effacer toute ma progression</button></div>
   <p class="muted" style="font-size:.85rem">Ta progression est enregistrée dans ce navigateur, sur cet appareil uniquement.</p>
  </div></div>`;
}

/* ================== ROUTEUR ================== */
function route(){
  if(SES&&location.hash==="#session")return;
  if(SES){stopAll();SES=null;document.body.classList.remove("in-session")}
  const h=(location.hash||"#accueil").slice(1); const [v,arg]=h.split("-");
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.v===v));
  const app=$("#app");
  if(v==="entrainement"){app.innerHTML=pageTrain(arg?+arg:0);
    document.querySelectorAll("[data-start]").forEach(b=>b.onclick=()=>{const p=+b.dataset.start,us=byPart(p);const short=p<=2||p===5?10:3;
      startSession(b.dataset.k==="all"?shuffle(us):shuffle(us).slice(0,short),"train",{title:PARTS[p].n+" · "+PARTS[p].t})})}
  else if(v==="test"){app.innerHTML=pageTest();$("#mini").onclick=()=>startExam("mini");$("#full").onclick=()=>startExam("full")}
  else if(v==="vocabulaire"){app.innerHTML=pageVocab();bindVocab()}
  else if(v==="grammaire"){app.innerHTML=pageGrammar();document.querySelectorAll("[data-gtag]").forEach(b=>b.onclick=()=>{const g=GRAMMAR.find(x=>x.tag===b.dataset.gtag);startSession(shuffle(byPart(5).filter(u=>u.tag===g.tag)),"train",{title:g.t})})}
  else if(v==="progres"){app.innerHTML=pageProgress();
    const r=$("#redo");if(r)r.onclick=()=>{const us=UNITS.filter(u=>u.qs.some(q=>S.ans[q.uid]&&S.ans[q.uid].last===false));startSession(us,"train",{title:"Mes erreurs"})};
    $("#reset").onclick=()=>{$("#resetzone").innerHTML=`<div class="confirm"><span>Tout effacer (réponses, tests, vocabulaire) ?</span><button class="btn small accent" id="ry">Oui, effacer</button><button class="btn small ghost" id="rn">Annuler</button></div>`;
      $("#ry").onclick=()=>{S={ans:{},hist:[],vocab:{},rate:0.9,showText:false};save();toast("Progression effacée");route()};$("#rn").onclick=route}}
  else {app.innerHTML=pageHome();document.querySelectorAll("#nav a")[0].classList.add("on")}
  if(v!=="vocabulaire")window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
if(location.hash==="#session")location.hash="accueil";
route();
</script>
</body>
</html>
