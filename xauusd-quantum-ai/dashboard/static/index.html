<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XAUUSD Quantum AI - tableau de bord</title>
<style>
  .viz-root {
    color-scheme: light;
    --surface-0: #f4f4f2; --surface-1: #fcfcfb; --border: #e2e1dc;
    --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #7a7974;
    --series-1: #2a78d6; --grid: #ecebe7;
    --good: #0f7b3e; --warning: #a35f00; --critical: #c42b2b;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --surface-0: #111110; --surface-1: #1a1a19; --border: #2f2e2b;
      --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
      --series-1: #3987e5; --grid: #262523;
      --good: #4cc27d; --warning: #e0a03a; --critical: #ef6b6b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .viz-root { background: var(--surface-0); color: var(--text-primary); min-height: 100vh; padding: 20px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--text-secondary); margin-bottom: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .tile, .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
  .tile .k { color: var(--text-secondary); font-size: 12px; }
  .tile .v { font-size: 22px; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .card { margin-bottom: 16px; }
  .card h2 { font-size: 14px; margin: 0 0 8px; }
  .status { display: inline-flex; gap: 6px; align-items: center; font-weight: 600; }
  .st-good { color: var(--good); } .st-warn { color: var(--warning); } .st-crit { color: var(--critical); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 12.5px; }
  th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--grid); }
  th { color: var(--text-secondary); font-weight: 600; }
  .scroll { max-height: 320px; overflow: auto; }
  .kv { display: grid; grid-template-columns: 140px 1fr; gap: 4px 12px; }
  .kv div:nth-child(odd) { color: var(--text-secondary); }
  #chart { width: 100%; height: 260px; position: relative; }
  #chart svg { width: 100%; height: 100%; display: block; }
  #tip { position: absolute; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border);
         border-radius: 6px; padding: 6px 8px; font-size: 12px; display: none; white-space: nowrap; }
  button { font: inherit; padding: 7px 14px; border-radius: 6px; border: 1px solid var(--critical);
           background: transparent; color: var(--critical); cursor: pointer; }
  input { font: inherit; padding: 6px; border-radius: 6px; border: 1px solid var(--border);
          background: var(--surface-1); color: var(--text-primary); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .muted { color: var(--text-muted); }
</style>
</head>
<body>
<div class="viz-root">
  <h1>XAUUSD Quantum AI</h1>
  <div class="sub" id="sub">connexion…</div>

  <div class="grid" id="tiles"></div>

  <div class="card">
    <h2>Courbe de P&amp;L cumulé (positions clôturées)</h2>
    <div id="chart"><div id="tip"></div></div>
    <div class="muted" id="chartNote"></div>
  </div>

  <div class="card">
    <h2>Signal et état du système</h2>
    <div class="kv" id="kv"></div>
  </div>

  <div class="card">
    <h2>Dernières décisions (acceptées et refusées)</h2>
    <div class="scroll"><table id="dec"><thead></thead><tbody></tbody></table></div>
  </div>

  <div class="card">
    <h2>Historique des opérations</h2>
    <div class="scroll"><table id="trd"><thead></thead><tbody></tbody></table></div>
  </div>

  <div class="card">
    <h2>Arrêt d'urgence</h2>
    <div class="row">
      <input id="token" type="password" placeholder="jeton du serveur (--token)">
      <button id="stop">STOP : fermer les positions et arrêter l'EA</button>
      <span id="stopMsg" class="muted"></span>
    </div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const fmt = (v, d = 2) => (v === null || v === undefined || isNaN(v)) ? "–" : Number(v).toFixed(d);

function tile(k, v, cls) {
  const t = document.createElement("div"); t.className = "tile";
  const a = document.createElement("div"); a.className = "k"; a.textContent = k;
  const b = document.createElement("div"); b.className = "v" + (cls ? " " + cls : ""); b.textContent = v;
  t.append(a, b); return t;
}

function fillTable(el, cols, rows) {
  const thead = el.querySelector("thead"), tbody = el.querySelector("tbody");
  thead.replaceChildren(); tbody.replaceChildren();
  const hr = document.createElement("tr");
  cols.forEach(c => { const th = document.createElement("th"); th.textContent = c; hr.append(th); });
  thead.append(hr);
  rows.slice().reverse().forEach(r => {
    const tr = document.createElement("tr");
    cols.forEach(c => { const td = document.createElement("td"); td.textContent = r[c] ?? ""; tr.append(td); });
    tbody.append(tr);
  });
}

function drawEquity(points) {
  const box = $("chart"), tip = $("tip");
  box.querySelectorAll("svg").forEach(s => s.remove());
  if (points.length < 2) { $("chartNote").textContent = "Pas encore assez de positions clôturées."; return; }
  $("chartNote").textContent = points.length - 1 + " positions clôturées";
  const W = box.clientWidth, H = box.clientHeight, m = {l: 54, r: 12, t: 10, b: 24};
  const ys = points.map(p => p.y), lo = Math.min(0, ...ys), hi = Math.max(0, ...ys), span = (hi - lo) || 1;
  const X = i => m.l + i * (W - m.l - m.r) / (points.length - 1);
  const Y = v => m.t + (hi - v) * (H - m.t - m.b) / span;
  const ns = "http://www.w3.org/2000/svg", svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const css = getComputedStyle(box);
  for (let k = 0; k <= 4; k++) {
    const v = lo + k * span / 4, g = document.createElementNS(ns, "line");
    g.setAttribute("x1", m.l); g.setAttribute("x2", W - m.r); g.setAttribute("y1", Y(v)); g.setAttribute("y2", Y(v));
    g.setAttribute("stroke", css.getPropertyValue("--grid")); svg.append(g);
    const t = document.createElementNS(ns, "text"); t.textContent = fmt(v);
    t.setAttribute("x", m.l - 6); t.setAttribute("y", Y(v) + 4); t.setAttribute("text-anchor", "end");
    t.setAttribute("font-size", "11"); t.setAttribute("fill", css.getPropertyValue("--text-secondary")); svg.append(t);
  }
  const path = document.createElementNS(ns, "path");
  path.setAttribute("d", points.map((p, i) => (i ? "L" : "M") + X(i) + " " + Y(p.y)).join(" "));
  path.setAttribute("fill", "none"); path.setAttribute("stroke", css.getPropertyValue("--series-1"));
  path.setAttribute("stroke-width", "2"); path.setAttribute("stroke-linejoin", "round"); svg.append(path);
  const hair = document.createElementNS(ns, "line");
  hair.setAttribute("y1", m.t); hair.setAttribute("y2", H - m.b); hair.setAttribute("stroke", css.getPropertyValue("--text-muted"));
  hair.style.display = "none"; svg.append(hair);
  const dot = document.createElementNS(ns, "circle"); dot.setAttribute("r", 4);
  dot.setAttribute("fill", css.getPropertyValue("--series-1")); dot.setAttribute("stroke", css.getPropertyValue("--surface-1"));
  dot.setAttribute("stroke-width", 2); dot.style.display = "none"; svg.append(dot);
  svg.addEventListener("pointermove", e => {
    const r = svg.getBoundingClientRect(), x = (e.clientX - r.left) * W / r.width;
    const i = Math.max(0, Math.min(points.length - 1, Math.round((x - m.l) / ((W - m.l - m.r) / (points.length - 1)))));
    hair.setAttribute("x1", X(i)); hair.setAttribute("x2", X(i)); hair.style.display = "";
    dot.setAttribute("cx", X(i)); dot.setAttribute("cy", Y(points[i].y)); dot.style.display = "";
    tip.textContent = `${points[i].label} · cumul ${fmt(points[i].y)}`;
    tip.style.display = "block";
    tip.style.left = Math.min(r.width - 220, X(i) * r.width / W + 10) + "px"; tip.style.top = "8px";
  });
  svg.addEventListener("pointerleave", () => { hair.style.display = dot.style.display = tip.style.display = "none"; });
  box.append(svg);
}

async function refresh() {
  try {
    const [s, t, d] = await Promise.all(["/api/status", "/api/trades", "/api/decisions"].map(u => fetch(u).then(r => r.json())));
    if (s.error) { $("sub").textContent = s.error; } else {
      const halted = s.halt && s.halt.length;
      $("sub").replaceChildren();
      const st = document.createElement("span");
      st.className = "status " + (halted ? "st-crit" : s.paused ? "st-warn" : "st-good");
      st.textContent = halted ? "■ ARRÊTÉ – " + s.halt : s.paused ? "❚❚ EN PAUSE" : "● EN MARCHE";
      $("sub").append(st, document.createTextNode(`  mode ${s.mode} · mis à jour ${s.time}`));
      $("tiles").replaceChildren(
        tile("Capital (balance)", fmt(s.balance)), tile("Equity", fmt(s.equity)),
        tile("P/L du jour", fmt(s.day_pnl), s.day_pnl < 0 ? "st-crit" : ""), tile("P/L total", fmt(s.total_pnl)),
        tile("Drawdown", fmt(s.drawdown_pct) + " %", s.drawdown_pct >= 3 ? "st-warn" : ""),
        tile("Trades (jour)", `${s.trades} (${s.trades_today})`), tile("Win rate", fmt(s.win_rate, 1) + " %"),
        tile("Profit factor", fmt(s.profit_factor)), tile("Risque engagé", fmt(s.risk_open)),
        tile("Positions", String(s.positions)));
      const kv = [["Signal", s.signal], ["Stratégie", s.strategy], ["Score", fmt(s.score, 1) + " / 100"],
                  ["Probabilité IA", s.ai_prob >= 0 ? fmt(s.ai_prob, 3) : "–"], ["État IA", s.ai_state],
                  ["Régime", s.regime], ["Session", s.session], ["Actualités", s.news],
                  ["Prochain événement", s.next_event], ["Dernière décision", s.last_decision]];
      $("kv").replaceChildren(...kv.flatMap(([k, v]) => { const a = document.createElement("div"); a.textContent = k;
        const b = document.createElement("div"); b.textContent = v ?? "–"; return [a, b]; }));
    }
    const closes = (t.trades || []).filter(x => x.event === "CLOSE");
    let cum = 0; const pts = [{y: 0, label: "départ"}];
    closes.forEach(c => { cum += Number(c.pnl || 0); pts.push({y: cum, label: `${c.time} ${c.strategy} ${Number(c.pnl).toFixed(2)}`}); });
    drawEquity(pts);
    fillTable($("trd"), ["time", "event", "ticket", "strategy", "dir", "lots", "price", "sl", "tp", "pnl", "r", "reason"], t.trades || []);
    fillTable($("dec"), ["time", "strategy", "dir", "regime", "score", "ai_prob", "session", "rr", "decision"], (d.decisions || []).slice(-100));
  } catch (e) { $("sub").textContent = "serveur injoignable : " + e; }
}

$("stop").addEventListener("click", async () => {
  if (!confirm("Fermer toutes les positions de l'EA et l'arrêter ?")) return;
  const r = await fetch("/api/stop", {method: "POST", headers: {"Content-Type": "application/json"},
                                       body: JSON.stringify({token: $("token").value})});
  const j = await r.json(); $("stopMsg").textContent = j.message || j.error;
});
refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>
