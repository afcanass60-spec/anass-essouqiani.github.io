# Blueprint Render pour Job Hunter AI (formule gratuite : 1 service web + PostgreSQL).
# Render : New > Blueprint > choisir ce dépôt (et la branche contenant job-hunter-ai).
# Voir job-hunter-ai/docs/HEBERGEMENT.md
services:
  - type: web
    name: job-hunter-ai
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: ./job-hunter-ai
    dockerfilePath: ./job-hunter-ai/Dockerfile.render
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: job-hunter-db
          property: connectionString
      - key: LOG_LEVEL
        value: INFO
      # Clés à saisir dans le tableau de bord Render (laisser vide si vous ne les avez pas encore)
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FRANCE_TRAVAIL_CLIENT_ID
        sync: false
      - key: FRANCE_TRAVAIL_CLIENT_SECRET
        sync: false
      - key: LBA_API_TOKEN
        sync: false
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: PRIM_API_KEY
        sync: false

databases:
  - name: job-hunter-db
    plan: free
    region: frankfurt
    databaseName: jobhunter
    user: jobhunter
