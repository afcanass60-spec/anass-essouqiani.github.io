# Job Hunter AI — pile complète : PostgreSQL, Redis, API FastAPI, worker + planificateur Celery, frontend Next.js.
# Démarrage : cp .env.example .env  (puis renseigner les clés)  &&  docker compose up -d --build
name: job-hunter-ai

x-backend: &backend
  build: ./backend
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://jobhunter:${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD}@db:5432/jobhunter
    REDIS_URL: redis://redis:6379/0
    STORAGE_DIR: /app/storage
  volumes:
    - storage:/app/storage
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jobhunter
      POSTGRES_USER: jobhunter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U jobhunter"], interval: 5s, retries: 10 }
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }
    restart: unless-stopped

  api:
    <<: *backend
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"], interval: 15s, retries: 5 }

  worker:
    <<: *backend
    command: ["celery", "-A", "app.worker.celery_app", "worker", "-l", "INFO", "--concurrency", "2"]

  beat:
    <<: *backend
    command: ["celery", "-A", "app.worker.celery_app", "beat", "-l", "INFO", "-s", "/app/storage/celerybeat-schedule"]

  web:
    build: { context: ./frontend, args: { BACKEND_URL: http://api:8000 } }
    environment: { BACKEND_URL: http://api:8000 }
    ports: ["127.0.0.1:3000:3000"]
    depends_on: { api: { condition: service_healthy } }
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  storage:
